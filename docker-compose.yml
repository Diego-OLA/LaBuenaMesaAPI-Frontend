services:
  # ---------------------------------------------------------------
  # API RESTful (Laravel 12 + PHP-FPM 8.4)
  # No publica puertos: nginx le habla por FastCGI en api:9000
  # ---------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: la-buena-mesa-api:latest
    container_name: la-buena-mesa-api
    restart: unless-stopped
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "La Buena Mesa API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-base64:3FsFkCdlIFGtcjY7jxRxlg2l1NZgdP6jAqzZtNPkKKE=}"
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: es_MX
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE:-la_buena_mesa}"
      DB_USERNAME: "${MYSQL_USER:-labuena}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-labuena_secret}"
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,127.0.0.1:3000"
      FRONTEND_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}"
    networks:
      - la-buena-mesa

  # ---------------------------------------------------------------
  # nginx: puerta de entrada HTTP de la API (sirve public/ y hace
  # proxy FastCGI de los .php hacia api:9000)
  # ---------------------------------------------------------------
  nginx:
    build:
      context: ./api
      dockerfile: Dockerfile.nginx
    image: la-buena-mesa-nginx:latest
    container_name: la-buena-mesa-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - api
    networks:
      - la-buena-mesa

  # ---------------------------------------------------------------
  # Frontend Next.js 16 (React 19 + Tailwind 4)
  # ---------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Se inyecta en tiempo de build (lo usan los Client Components)
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}"
    image: la-buena-mesa-web:latest
    container_name: la-buena-mesa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Server Components / SSR: dentro de la red de Docker el host es "nginx"
      API_URL: "http://nginx/api"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}"
    depends_on:
      - nginx
    networks:
      - la-buena-mesa

  # ---------------------------------------------------------------
  # MySQL 8.4
  # Se publica en 3307 para no chocar con un MySQL local (WAMP/XAMPP)
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: la-buena-mesa-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-la_buena_mesa}"
      MYSQL_USER: "${MYSQL_USER:-labuena}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-labuena_secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - la-buena-mesa

volumes:
  mysql_data:

networks:
  la-buena-mesa:
    driver: bridge
